<body>

       <h1>🍳 Consulta de CEP</h1>

       <div class="resultado" id="resultado">

            <p>Bairro: <span id="bairro">--</span></p>
            <p>Região: <span id="regiao">--</span></p>
            <p>Estado: <span id="estado">--</span></p>
       </div>       
    </div>
    
</body>
